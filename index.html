
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
   
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Subscription Tracker</h1>
    </header>
    <nav>
    <a href="index.html">Home</a>
    <a href="subscriptions.html">My Subscriptions</a>
</nav>
<p>Manage your subscriptions easily</p>
<a href="index.html" class="back-button">Back to Home</a>
    <!-- Summary Section -->
    <section id="summary">
        <h2>Summary</h2>

        <div>
            <h3>Total Subscriptions</h3>
            <p id="totalSubscriptions">0</p>
        </div>

        <div>
            <h3>Expired Subscriptions</h3>
            <p id="expiredSubscriptions">0</p>
        </div>
    </section>

    <!-- Subscription Form Section -->
    <section id="subscription-form">
        <h2>Add New Subscription</h2>

       <form id="subscriptionForm" class="card p-4 shadow-sm">

            <label for="service">Service</label>
            <input type="text" id="service" required>

            <label for="provider">Provider</label>
            <input type="text" id="provider" required>

            <label for="subscriber">Subscriber</label>
            <input type="text" id="subscriber" required>

            <label for="renewalDate">Renewal Date</label>
            <input type="date" id="renewalDate" required>

            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Music">Music</option>
                <option value="Software">Software</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">Add Subscription</button>
            <button type="submit" class="btn btn-primary">Add Subscription</button>

        </form>
    </section>

   <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
